[package]
name = "yep-giveaway"
version = "0.1.0"
edition = "2024"
description = "Collect Twitch chat giveaway entries by keyword and draw a weighted winner"
license = "MIT"
publish = false

[dependencies]
directories = "6.0.0"
gpui-kit = "0.10"
indexmap = "2.14.2"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"

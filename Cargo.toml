[package]
name = "yep-giveaway"
version = "0.1.0"
edition = "2024"
description = "Collect Twitch chat giveaway entries by keyword and draw a weighted winner"
license = "MIT"
publish = false

[dependencies]
gpui-kit = "0.10"
indexmap = "2.14.2"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "streamer-giveaway"
version = "0.1.0"
edition = "2024"
description = "Collect Twitch chat giveaway entries by keyword and draw a weighted winner"
license = "MIT"
publish = false

[dependencies]
async-channel = "2.5.0"
directories = "6.0.0"
gpui-kit = "0.10"
indexmap = "2.14.2"
rand = "0.10.4"
rust-i18n = "4.2"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
twitch-irc = "6.1.3"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"

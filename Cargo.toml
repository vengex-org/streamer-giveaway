[package]
name = "streamer-giveaway"
version = "0.4.4"
edition = "2024"
description = "Desktop app for chat giveaways on Twitch, Kick and YouTube: keyword entries, bonus tickets, entry conditions and a winner reveal for stream"
license = "MIT"
repository = "https://github.com/vengex-org/streamer-giveaway"
readme = "README.md"
keywords = ["twitch", "giveaway", "raffle", "streaming", "gpui"]
categories = ["gui"]
publish = false

[dependencies]
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
gpui-kit = "0.10"
indexmap = "2.14.2"
rand = "0.10.4"
rust-i18n = "4.2"
serde = { version = "1.0.229", features = ["derive"] }
gpui-pre-reqwest-client = "=0.3.12"
anyhow = "1"
futures = "0.3"
serde_json = "1.0.154"
sys-locale = "0.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
twitch-irc = "6.1.3"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
gpui-pre-reqwest = { version = "=0.12.15", default-features = false, features = ["rustls-tls-native-roots"] }
uuid = { version = "1.29.3", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3.27.0"
# Paused clock for the reconnect tests.
tokio = { version = "1.54.1", features = ["test-util"] }

en = "“%{kw} lets go” counts, “%{kw}xyz” doesn't"
cs = "„%{kw} jedeme“ platí, „%{kw}xyz“ ne"
es = "«%{kw} vamos» cuenta, «%{kw}xyz» no"

[step.keyword.example.exact]
sk = "„%{kw}“ platí, „%{kw} ideme“ nie"
en = "“%{kw}” counts, “%{kw} lets go” doesn't"

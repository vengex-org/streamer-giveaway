[step.connect.hint]
sk = "Napíš názov svojho Twitch kanála, ten z odkazu na tvoj stream."
en = "Type your Twitch channel name, the one in your stream link."
cs = "Napiš název svého Twitch kanálu, ten z odkazu na tvůj stream."
es = "Escribe el nombre de tu canal de Twitch, el de tu enlace."

[step.connect.placeholder]
sk = "názov kanála"

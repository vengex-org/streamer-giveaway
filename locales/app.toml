sk = "Nájdi prihláseného podľa mena"
en = "Find an entrant by name"
cs = "Najdi přihlášeného podle jména"
es = "Busca a un inscrito por nombre"

[stage.search.count]
sk = "%{found} z %{total}"
en = "%{found} of %{total}"
cs = "%{found} z %{total}"
es = "%{found} de %{total}"

[stage.search.none]
sk = "Nikto s takým menom nie je prihlásený."
en = "Nobody with that name has entered."
cs = "Nikdo s takovým jménem není přihlášený."
es = "Nadie con ese nombre se ha inscrito."

# Demo window from the header

[header.demo.button]
sk = "Vyskúšať demo"
en = "Try demo"
cs = "Vyzkoušet demo"
es = "Probar demo"

[header.demo.tooltip]
sk = "Otvorí druhé okno so simulovaným chatom. Tvoje nastavenia a kanál sa nezmenia."
en = "Opens a second window with a simulated chat. Your settings and channel stay as they are."
cs = "Otevře druhé okno se simulovaným chatem. Tvoje nastavení a kanál se nezmění."
es = "Abre una segunda ventana con un chat simulado. Tu configuración y tu canal no cambian."

[header.update]
sk = "Nová verzia %{version}"
en = "New version %{version}"
cs = "Nová verze %{version}"
es = "Nueva versión %{version}"

[header.update_tooltip]
sk = "Otvorí stránku na stiahnutie v prehliadači"
en = "Opens the download page in your browser"
cs = "Otevře stránku ke stažení v prohlížeči"
es = "Abre la página de descarga en el navegador"

[header.demo.chat]
sk = "Chat"
en = "Chat"
cs = "Chat"
es = "Chat"

[header.demo.chat_tooltip]
sk = "Ukáže okno so simulovaným chatom tak, ako ho appka číta."
en = "Shows the window with the simulated chat as the app reads it."
cs = "Ukáže okno se simulovaným chatem tak, jak ho appka čte."
es = "Muestra la ventana con el chat simulado tal como lo lee la app."

[chat_window.title]
sk = "Simulovaný chat (demo)"
en = "Simulated chat (demo)"
cs = "Simulovaný chat (demo)"
es = "Chat simulado (demo)"

[chat_window.count]
sk = "%{count} správ, zobrazených posledných %{kept}"
en = "%{count} messages, showing the last %{kept}"
cs = "%{count} zpráv, zobrazeno posledních %{kept}"
es = "%{count} mensajes, se muestran los últimos %{kept}"

[header.demo.badge]
sk = "Demo"
en = "Demo"
cs = "Demo"
es = "Demo"

[error.demo]
sk = "Demo sa nepodarilo spustiť: %{cause}"
en = "Could not start the demo: %{cause}"
cs = "Demo se nepodařilo spustit: %{cause}"
es = "No se pudo iniciar la demo: %{cause}"

# Chat that cannot be read

[header.status.failed]
sk = "Chat %{channel} sa nedá čítať: %{reason}"
en = "Cannot read the %{channel} chat: %{reason}"
cs = "Chat %{channel} nejde číst: %{reason}"
es = "No se puede leer el chat de %{channel}: %{reason}"

[status.fail.not_found]
sk = "kanál neexistuje"
en = "the channel does not exist"
cs = "kanál neexistuje"
es = "el canal no existe"

[status.fail.offline]
sk = "stream práve nebeží"
en = "the stream is not live"
cs = "stream právě neběží"
es = "el directo no está en vivo"

[status.fail.blocked]
sk = "platforma pripojenie zablokovala"
en = "the platform blocked the connection"
cs = "platforma připojení zablokovala"
es = "la plataforma bloqueó la conexión"

[status.fail.protocol]
sk = "neočakávaná odpoveď (%{detail})"
en = "unexpected answer (%{detail})"
cs = "neočekávaná odpověď (%{detail})"
es = "respuesta inesperada (%{detail})"

# Chat platforms

[step.connect.mode.single]
sk = "Jedna platforma"
en = "One platform"
cs = "Jedna platforma"
es = "Una plataforma"

[step.connect.mode.multi]
sk = "Multistream"
en = "Multistream"
cs = "Multistream"
es = "Multistream"

[step.connect.hint_kick]
sk = "Napíš názov kanála z adresy kick.com/ alebo vlož celý odkaz."
en = "Type the channel name from your kick.com/ link, or paste the whole link."
cs = "Napiš název kanálu z adresy kick.com/ nebo vlož celý odkaz."
es = "Escribe el nombre del canal de tu enlace kick.com/ o pega el enlace completo."

[step.connect.hint_youtube]
sk = "Vlož odkaz na živý stream alebo @handle kanála. Kanál musí práve vysielať."
en = "Paste the live stream link or the channel's @handle. The channel has to be live."
cs = "Vlož odkaz na živý stream nebo @handle kanálu. Kanál musí právě vysílat."
es = "Pega el enlace del directo o el @handle del canal. El canal tiene que estar en directo."

[step.connect.hint_multi]
sk = "Pripoj každý chat, kde práve vysielaš. Prihlášky zo všetkých idú do jedného žrebovania."
en = "Connect every chat you are streaming to. Entries from all of them go into one draw."
cs = "Připoj každý chat, kde právě vysíláš. Přihlášky ze všech jdou do jednoho losování."
es = "Conecta cada chat en el que estés transmitiendo. Las inscripciones de todos van al mismo sorteo."

[step.connect.placeholder_kick]
sk = "názov kanála alebo odkaz"
en = "channel name or link"
cs = "název kanálu nebo odkaz"
es = "nombre del canal o enlace"

[step.connect.placeholder_youtube]
sk = "odkaz na stream alebo @handle"
en = "stream link or @handle"
cs = "odkaz na stream nebo @handle"
es = "enlace del directo o @handle"

[header.status.multi]
sk = "Čítam %{connected} z %{total} chatov"
en = "Reading %{connected} of %{total} chats"
cs = "Čtu %{connected} z %{total} chatů"
es = "Leyendo %{connected} de %{total} chats"

[error.kick_invalid]
sk = "„%{raw}“ nie je Kick kanál. Napíš názov z adresy kick.com/<názov>."
en = '"%{raw}" is not a Kick channel. Type the name from kick.com/<name>.'
cs = "„%{raw}“ není Kick kanál. Napiš název z adresy kick.com/<název>."
es = "«%{raw}» no es un canal de Kick. Escribe el nombre de kick.com/<nombre>."

[error.youtube_invalid]
sk = "„%{raw}“ nie je odkaz na YouTube stream ani @handle kanála."
en = '"%{raw}" is not a YouTube stream link or a channel @handle.'
cs = "„%{raw}“ není odkaz na YouTube stream ani @handle kanálu."
es = "«%{raw}» no es un enlace de directo de YouTube ni el @handle de un canal."

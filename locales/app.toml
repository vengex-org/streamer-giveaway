es = "nombre del canal"

[step.connect.connect]
sk = "Pripojiť"
en = "Connect"
cs = "Připojit"
es = "Conectar"

[step.connect.disconnect]
sk = "Odpojiť"
en = "Disconnect"
cs = "Odpojit"
es = "Desconectar"

[step.keyword.title]
sk = "Vyber kľúčové slovo"
en = "Choose the keyword"

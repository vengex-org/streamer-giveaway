es = "Se perdió #%{channel}, reconectando: %{cause}"

[header.theme.to_dark]
sk = "Tmavý režim"
en = "Dark mode"
cs = "Tmavý režim"
es = "Modo oscuro"

[header.theme.to_light]
sk = "Svetlý režim"
en = "Light mode"
cs = "Světlý režim"
es = "Modo claro"

# Steps column

[step.next]

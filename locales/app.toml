_version = 2

# Every leaf has sk, en, cs and es. `tests` in src/i18n.rs fails when one is missing or when the
# %{placeholders} differ between languages.

[app.title]
sk = "Streamer Giveaway"
en = "Streamer Giveaway"
cs = "Streamer Giveaway"
es = "Streamer Giveaway"

# Header

[header.status.idle]
sk = "Nepripojené"
en = "Not connected"
cs = "Nepřipojeno"
es = "Sin conexión"

[header.status.connecting]
sk = "Pripájam sa k #%{channel}…"
en = "Connecting to #%{channel}…"
cs = "Připojuji se k #%{channel}…"
es = "Conectando a #%{channel}…"

[header.status.connecting_cause]
sk = "Pripájam sa k #%{channel}: %{cause}"
en = "Connecting to #%{channel}: %{cause}"
cs = "Připojuji se k #%{channel}: %{cause}"
es = "Conectando a #%{channel}: %{cause}"

[header.status.connected]
sk = "Čítam chat #%{channel}"
en = "Reading #%{channel} chat"
cs = "Čtu chat #%{channel}"
es = "Leyendo el chat de #%{channel}"

[header.status.reconnecting]
sk = "Spojenie s #%{channel} padlo, pripájam znova…"
en = "Lost #%{channel}, reconnecting…"
cs = "Spojení s #%{channel} spadlo, připojuji znovu…"
